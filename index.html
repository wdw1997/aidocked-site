<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Docked — Never Miss Another Job Lead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FFFFFF; --bg-soft: #F6F8FB; --ink: #0F1B2D; --ink-muted: #5B6B82; --primary: #2454E8; --primary-dark: #1B3FBD; --border: #E4E9F1; --dark-card: #0F1B2D; }
  * { box-sizing: inherit; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: 'Inter', sans-serif; color: var(--ink); background: var(--bg); }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  header.nav { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; max-width: 1120px; margin: 0 auto; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; }
  .logo-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--primary), #4F7CFB); display: flex; align-items: center; justify-content: center; color: #fff; }
  nav.links { display: flex; gap: 32px; }
  nav.links a { font-size: 15px; font-weight: 500; color: var(--ink-muted); }
  .nav-cta { background: var(--primary); color: #fff !important; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
  .hero { text-align: center; padding: 88px 24px 56px; background: var(--bg-soft); }
  .btn-primary { background: var(--primary); color: #fff; padding: 15px 28px; border-radius: 9px; font-weight: 600; display: inline-block; }
  .btn-secondary { background: #fff; color: var(--ink); padding: 15px 28px; border-radius: 9px; border: 1px solid var(--border); display: inline-block; }
  /* (其他样式保持不变...) */
  .legal-page { display: none; padding: 56px 24px 90px; }
  body[data-route="home"] #home-view { display: block; }
  body[data-route="privacy"] #home-view { display: none; }
  body[data-route="privacy"] #privacy-view { display: block; }
  body[data-route="terms"] #home-view { display: none; }
  body[data-route="terms"] #terms-view { display: block; }
</style>
</head>
<body data-route="home">

<header class="nav">
  <div class="nav-inner">
    <a href="#home" class="logo"><span class="logo-mark">A</span>AI Docked</a>
    <nav class="links">
      <a href="#features-sec">Features</a>
      <a href="#how-sec">How it works</a>
      <a href="#pricing-sec">Pricing</a>
    </nav>
    <div class="nav-right">
      <!-- 已修改跳转到 admin.html -->
      <a href="/admin.html" class="nav-cta">Start Free Trial</a>
    </div>
  </div>
</header>

<div id="home-view">
  <section class="hero">
    <div class="wrap">
      <h1>Never miss another job lead.</h1>
      <p class="sub">AI Docked answers every customer text instantly and books the job on your calendar.</p>
      <div class="hero-ctas">
        <!-- 已修改跳转到 admin.html -->
        <a href="/admin.html" class="btn-primary">Start Free Trial</a>
        <a href="#pricing-sec" class="btn-secondary">See Pricing</a>
      </div>
    </div>
  </section>
  <!-- 其余部分保持原样，记得在页脚的 CTA 也改一下 -->
  <section class="cta-band">
    <h2>Stop losing jobs to a missed text.</h2>
    <a href="/admin.html" class="btn-primary">Start Free Trial</a>
  </section>
</div>

<!-- (此处省略中间冗长的 Features/Pricing 部分，保持你原有的内容即可) -->

<script>
  function route() {
    var hash = window.location.hash.replace('#', '');
    var r = 'home';
    if (hash === 'privacy') r = 'privacy';
    else if (hash === 'terms') r = 'terms';
    document.body.setAttribute('data-route', r);
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
